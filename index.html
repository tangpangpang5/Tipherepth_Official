<!doctype html>
<html lang="zh-CN" data-theme="terminal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>TIPHERETH ARCHIVE</title>
    <meta name="description" content="个人博客与音乐档案：日志、作品与卡带墙。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0D'/%3E%3Cpath d='M6 10h20v12H6z' fill='none' stroke='%23F0E9A8' stroke-width='2'/%3E%3Cpath d='M10 14h5v4h-5z' fill='%234EE0B4'/%3E%3C/svg%3E" />
    <script>
      // 启动失败时把错误暴露到页面上，避免白屏无从排查
      (function () {
        function report(kind, detail) {
          var node = document.getElementById('app');
          if (node && !node.querySelector('.app')) node.textContent = kind + ' // ' + detail;
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') { report('LOAD ERROR', event.target.src); return; }
          report('ERR', (event.message || '') + ' @ ' + String(event.filename || '').split('/').pop() + ':' + event.lineno);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          report('REJECT', (event.reason && event.reason.message) || String(event.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app" aria-live="polite">LOADING // TIPHERETH ARCHIVE</div>
    <noscript>
      <div class="noscript">需要启用 JavaScript 才能读取档案。</div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
